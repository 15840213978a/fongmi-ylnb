name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 安装gh cli，使用gh下载Release资产，支持私有仓库
      - name: Download pre-built chaquopy cache via gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE_NAME="chaquopy-cache.tar.gz"
          TAG_NAME="cache-v1"
          # 下载当前仓库指定tag下的资产
          gh release download ${TAG_NAME} -p ${FILE_NAME}
          mkdir -p ~/.gradle/caches/
          tar -zxf ${FILE_NAME} -C ~/.gradle/caches/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
