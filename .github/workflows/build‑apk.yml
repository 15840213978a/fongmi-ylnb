name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 缓存已经下载好的chaquopy python包
      - name: Cache Chaquopy dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/chaquopy
          key: chaquopy-cache-${{ runner.os }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 增加网络超时，关闭daemon
      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
