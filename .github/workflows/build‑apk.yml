name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ===== 从仓库Release下载 chaquopy 预缓存包并解压 =====
      - name: Download pre-built chaquopy cache from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 👉 修改这里的 TAG_NAME 为你上传缓存包对应的Release标签
          TAG_NAME="cache-v1"
          FILE_NAME="chaquopy-cache.tar.gz"
          # 获取Release下载链接
          ASSET_URL=$(curl -sL https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG_NAME} | jq -r '.assets[] | select(.name == "${FILE_NAME}") | .browser_download_url')
          echo "Download url: ${ASSET_URL}"
          curl -L -o ${FILE_NAME} "${ASSET_URL}"
          # 解压到gradle缓存目录
          mkdir -p ~/.gradle/caches/
          tar -zxf ${FILE_NAME} -C ~/.gradle/caches/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 编译，关闭daemon，加长网络超时
      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
