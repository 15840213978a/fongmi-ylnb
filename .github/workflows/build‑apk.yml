name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ========== 直接写死Release下载链接，去掉jq，不会出现null报错 ==========
      - name: Download pre-built chaquopy cache
        run: |
          FILE_NAME="chaquopy-cache.tar.gz"
          # 👉 替换下面URL为你Release里面chaquopy-cache.tar.gz的browser_download_url
          DOWNLOAD_URL="https://github.com/你的用户名/你的仓库名/releases/download/cache-v1/chaquopy-cache.tar.gz"
          curl -L -o ${FILE_NAME} "${DOWNLOAD_URL}"
          mkdir -p ~/.gradle/caches/
          tar -zxf ${FILE_NAME} -C ~/.gradle/caches/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 编译，关闭daemon，加长网络超时
      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
